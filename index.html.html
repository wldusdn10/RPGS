<style>
:root{color-scheme:dark;--bg:#14261e;--panel:#1d3a2c;--chalk:#f4f1e6;--dim:#9db5a5;--yel:#f2c230;--navy:#1b2a49;--red:#e5534b;--line:#3b6650;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--chalk);font-family:'Noto Sans KR',sans-serif;overflow:hidden;user-select:none}

canvas{position:fixed;inset:0;display:block}

.scr.hide,.hide{display:none!important}

.row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:15px}.row span.l{width:48px}

#lv{top:calc(10px + env(safe-area-inset-top,0px));left:10px;background:#000a;padding:8px 12px;border-radius:10px;min-width:210px}
#xpb{height:12px;background:#0007;border-radius:6px;overflow:hidden;margin-top:4px}#xpb i{display:block;height:100%;width:0;background:#5ad1ff}
#hpb{height:12px;background:#0007;border-radius:6px;overflow:hidden;margin-top:4px}#hpb i{display:block;height:100%;width:100%;background:var(--red)}
#gold{top:calc(10px + env(safe-area-inset-top,0px));right:10px;background:#000a;padding:8px 14px;border-radius:10px;color:var(--yel);font-size:20px}
#skbtn{left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:84px;height:84px;border-radius:14px;background:var(--navy);border:3px solid var(--yel);display:grid;place-items:center;text-align:center;font-size:11px;pointer-events:auto!important;cursor:pointer;overflow:hidden}
#skbtn.rdy{box-shadow:0 0 16px var(--yel)}#skbtn em{position:absolute;left:0;bottom:0;width:100%;background:#000a;height:0}
#eq{right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:6px}
.sl{width:62px;height:62px;background:#000b;border:2px solid var(--line);border-radius:8px;text-align:center;font-size:10px;padding:4px;display:grid;place-items:center}
#tip{left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));background:#000b;padding:6px 14px;border-radius:20px;font-size:13px}
#toast{left:50%;transform:translateX(-50%);top:70px;color:var(--yel);font-size:18px;text-shadow:0 2px 4px #000}
#gl{display:flex;gap:6px;margin:8px 0;font-size:12px;justify-content:center;flex-wrap:wrap}#gl span{padding:2px 6px;border-radius:5px;background:#0006}
.chest{font-size:84px;display:inline-block}.shake{animation:sh .12s infinite}
@keyframes sh{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.08)}100%{transform:rotate(-8deg)}}
.aura{width:220px;height:220px;margin:-10px auto;border-radius:50%;display:grid;place-items:center;animation:pop .6s ease-out}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.shake,.aura{animation:none}}
@media(max-width:560px){.skill{position:static;width:auto;margin-bottom:8px}.grid{grid-template-columns:repeat(5,1fr)}}
:root{--bg:#0b0d33;--panel:#10144a;--line:#2a3180;--navy:#0e1245;--dim:#8f98d8}

<canvas id="cv"></canvas>

<div class="scr hide" id="title"><h1>🎮 신성고 RPG</h1><p class="sub">이어서 할 캐릭터(닉네임)를 고르세요</p><div id="tl" style="width:min(94vw,560px)"></div><button id="newc" style="margin-top:12px">＋ 새 캐릭터 만들기</button><textarea id="impt" placeholder="저장 코드를 붙여넣거나, 위 [코드] 버튼으로 복사하세요"></textarea><button class="g" id="impb" style="margin-top:6px">저장 코드 불러오기</button><div id="impm" class="sub"></div></div>
<div class="scr" id="sel">
  <div class="top"><div><h1>캐릭터를 골라주세요</h1><p class="sub">10명 중 한 명을 선택합니다.</p></div><div style="display:flex;gap:8px"><button id="bk0" style="display:none">← 저장 목록</button><button id="rst0">처음으로</button></div></div>
  <div class="wrap"><div class="grid" id="grid"></div>
  <div class="detail" id="det"><p class="sub">캐릭터를 눌러 보세요.</p></div></div>
  
</div>

<div class="ov hide" id="pts"><div class="box">
  <h2 id="ptn" style="margin:0 0 6px"></h2><div class="sub">스탯 포인트 <b id="ptl" style="color:var(--yel)"></b>개 남음</div><div id="ptr"></div>
  <div id="pte" style="margin-top:12px;text-align:left;font-size:14px"></div><button id="ptgo" style="margin-top:10px">확인</button></div></div>

<div class="ov hide" id="gach"><div class="box">
  <h2 id="glv" style="margin:0;color:var(--yel)"></h2><div class="gg"><i id="ggi"></i><b id="ggt"></b></div>
  <div id="gl"></div>
  <div id="gst" style="min-height:240px;display:grid;place-items:center"><div class="chest">🎁</div></div>
  <div id="gres" style="min-height:44px"></div>
  <button id="gdo">뽑기 (500원)</button> <button id="gdo10">10회 뽑기 (5000원)</button> <button id="gdo100">100회 뽑기 (50000원)</button> <button class="g" id="gskip" style="display:none">⏭ 스킵</button> <button class="g" id="gpet">🐾 펫 뽑기</button> <button class="g" id="ginfo">정보</button> <button class="g" id="gpot">포션 구매 (50원)</button> <button class="g" id="gx">닫기</button>
</div></div>

<script>

{n:'강민준',s:[1,3,1,1],k:'에겐방사',d:'주변 적을 매혹시켜 4초간 공격하지 못하게 합니다.',c:'#d96aa7'},
{n:'정래진',s:[5,6,5,4],k:'싸가지',d:'가장 가까운 적 한 명에게 주먹을 날려 큰 피해를 입힙니다.',c:'#c0392b'},

{n:'지연우',s:[7,7,7,7],k:null,d:'고유스킬은 없지만 모든 스탯이 높습니다.',c:'#e0b13a'},
{n:'김창욱',s:[4,4,4,4],k:'창욱이형',d:'따까리 3명(체력 20·공격 5, 레벨에 비례해 성장)을 소환해 함께 싸웁니다.',c:'#34495e'},

const SPR={};CH.forEach((c,i)=>SPR[c.c]=mk(i));
const sprURL=i=>SPR[CH[i].c].toDataURL();
const ETPL=['.WWWWWWWW.','WWWWWWWWWW','WWKKWWKKWW','WWWWWWWWWW','WWKKKKKKWW','WWWWWWWWWW','WWRRRRWWWW','WWRWWWWWWW','WWRRRWWWWW','WWRWWWWWWW','WWRWWWWWWW','WWWWWWWWWW','.KK....KK.'];
const ENS=(()=>{const m={W:'#f4f4f4',K:'#222',R:'#d93a3a'},c=document.createElement('canvas');c.width=10;c.height=13;const x=c.getContext('2d');ETPL.forEach((r,y)=>[...r].forEach((ch,xx)=>{if(m[ch]){x.fillStyle=m[ch];x.fillRect(xx,y,1,1)}}));return c})();
let sel=-1,me=null;

CH.forEach((c,i)=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<small class="no">${String(i+1).padStart(2,'0')}</small><img src="${sprURL(i)}"><div>${c.n}</div>`;d.onclick=()=>choose(i);grid.append(d)});
function choose_old(i){sel=i;const c=CH[i];
 [...grid.children].forEach((e,j)=>e.classList.toggle('on',i==j));
 $('#det').innerHTML=`<div class="skill"><b>${c.k?'고유스킬: '+c.k:'고유스킬 없음'}</b>${c.d}</div><h2 style="margin:0 0 8px;font-size:28px">${c.n}</h2>`+
 c.s.map((v,j)=>`<div class="row"><span class="l">${SN[j]}</span><div class="bar"><i style="width:${v*10}%"></i></div><b>${v}</b></div>`).join('');

 me={x:600,y:400,id:sel,st:[...c.s],pts:5,lv:1,xp:0,gold:100,hp:1,max:1,w:null,atkcd:0,skcd:0,buff:0,bulk:0,nap:0,face:[1,1],inv:0,pulls:0,g:[null,null,null,null]};
 $('#sel').classList.add('hide');openPts()};

 $('#det').innerHTML=`<div class="dt"><img class="big" src="${sprURL(sel)}"><div class="skill2"><small>고유스킬</small><b>${c.k||'없음'}</b>${c.d}</div></div><div class="no2">NO. ${String(sel+1).padStart(2,'0')}</div><h2 class="nm">${c.n}</h2><div class="pt"><span>스탯 포인트 <b>${left}</b>개 남음 (+ 로 찍기)</span><button class="sm" id="rs">초기화</button></div>`+
 c.s.map((v,j)=>`<div class="row2"><span class="l">${SN[j]}</span><div class="segs">${Array.from({length:10},(_,k)=>`<i class="${k<v+add[j]?'on':''}"></i>`).join('')}</div><b class="num">${v+add[j]}</b><button class="sq g" data-j="${j}" data-d="-1" ${add[j]?'':'disabled'}>−</button><button class="sq" data-j="${j}" data-d="1" ${left&&v+add[j]<10?'':'disabled'}>+</button></div>`).join('')+`<button id="go" class="big-go">이 캐릭터로 시작</button>`;
 $('#rs').onclick=()=>{add=[0,0,0,0];left=5;renderDet()};
 $('#det').querySelectorAll('.sq').forEach(b=>b.onclick=()=>{const j=+b.dataset.j,d=+b.dataset.d;if(d>0&&left>0&&CH[sel].s[j]+add[j]<10){add[j]++;left--}else if(d<0&&add[j]>0){add[j]--;left++}renderDet()});
 $('#go').onclick=()=>askNick(nick=>{me={nick,x:600,y:400,id:sel,st:c.s.map((v,j)=>v+add[j]),pts:left,lv:1,xp:0,gold:100,hp:1,max:1,w:null,atkcd:0,skcd:0,buff:0,bulk:0,nap:0,face:[1,1],inv:0,pulls:0,g:[null,null,null,null],bag:[],dcd:0,dash:0,pot:0};$('#sel').classList.add('hide');start();saveGame()})}
$('#rst0').onclick=()=>choose(0);
choose(0);
function need(l){return Math.round(20*Math.pow(l,1.45))}
function openPts(first){const c=CH[me.id];$('#pts').classList.remove('hide');$('#ptn').textContent=NM()+' 스탯 분배';
 const r=()=>{$('#pte').innerHTML=eqHtml();$('#ptl').textContent=me.pts;$('#ptr').innerHTML=me.st.map((v,j)=>`<div class="row" style="justify-content:center"><span class="l">${SN[j]}</span><b style="width:30px">${v}</b><button class="g" data-j="${j}" ${me.pts&&v<100?'':'disabled'}>+</button><button class="g" data-j="${j}" data-n="10" ${me.pts&&v<100?'':'disabled'}>+10</button></div>`).join('');
 $('#ptr').querySelectorAll('button').forEach(b=>b.onclick=()=>{const j=b.dataset.j,n=Math.min(+b.dataset.n||1,me.pts,100-me.st[j]);if(n>0){me.pts-=n;me.st[j]+=n;r()}})};r()}
$('#ptgo').onclick=()=>{$('#pts').classList.add('hide');if(!started)start();else{me.max=maxHP()}};
const gb=s=>me.g[s]?ib(me.g[s]):0;
const maxHP=()=>Math.round((20+me.st[0]*100+gb(1)+syn().h)*(me.bulk>0?1.2:1)*(1+pb().h+rb().h+we().h));
const atkV=()=>(2+me.st[1]*100+(me.w?ib(me.w):0)+syn().a)*(me.buff>0?2:1)*(1+pb().a+rb().a+we().a);
const defV=()=>Math.round((me.st[2]*10+gb(2)+syn().d)*(1+pb().d));const spdV=()=>Math.min(700,Math.round((110+me.st[3]*10+gb(3)+syn().v)*(1+pb().v)));

/* ---- Weapons ---- */
const RN=['일반','희귀','에픽','전설','신화','보스','초월'],RC=['#9aa0a6','#4cd964','#b05cff','#ffd400','#ff3b30','#22d3ee','#ff4de1'],WB=[60,135,210,286,360,450,620];
const WN=[['30cm 나무 자','낡은 빗자루','몽당 분필'],['쇠 줄넘기','야구 방망이','대걸레 창'],['칠판지우개 해머','급식판 수리검','교무실 지시봉'],['학생주임 회초리','급식 대왕 국자','교장선생님 지팡이'],['수능 만점 펜','신성고 교가 검','야자 종결자']];
const WI=['📏🧹🖍️','🪢⚾🔱','🔨🥏🪄','🏏🥄🦯','🖋️🗡️⛓️'].map(s=>[...s]);
function weights(){const s=Math.min(me.pulls*.7,45);return[70-s*.95,20+s*.4,7+s*.3,2+s*.2,.1+s*.05]}
const SL=['공격력','최대 체력','방어력','이동속도'];
const AB=[null,[294,386,476,568,658,820,1100],[3,5,7,9,11,13,18],[10,20,35,55,90,90,110]];
const AN=[null,['분필가루 모자','체육복 모자','공사장 안전모','교련 철모','졸업 학사모'],['후줄근 교복','체육복 상의','급식 앞치마','교련복 갑옷','명찰 갑옷'],['슬리퍼','실내화','운동화','축구화','야자 탈출 부츠']];
const AI=[null,['🧢','🎓','⛑️','🪖','👑'],['👕','🥋','🦺','🛡️','🎽'],['🩴','🧦','👟','⚽','🥾']];
function glv(){return 1+Math.floor(me.pulls/5)}
function showG(){const w=weights();$('#glv').textContent='뽑기 레벨 Lv.'+glv();{const pr=me.pulls%5;$('#ggi').style.width=pr/5*100+'%';$('#ggt').textContent='다음 레벨까지 '+(5-pr)+'회 ('+pr+'/5)'}
 $('#gl').innerHTML=w.map((p,i)=>`<span style="color:${RC[i]}">${RN[i]} ${p.toFixed(1)}%</span>`).join('');
 $('#gdo').disabled=me.gold<500}
let busy=false;
$('#gdo').onclick=()=>{if(busy||me.gold<500)return;busy=true;me.gold-=500;me.pulls++;
 const w=weights().map((p,i)=>p),t=w.reduce((a,b)=>a+b);let r=Math.random()*t,k=0;
 // weights computed before pulls++ is close enough; recompute fresh
 for(;k<4&&r>=w[k];k++)r-=w[k];
 const q=ITEMS[k][Math.floor(Math.random()*8)],sl=q.s,it={r:k,s:sl,n:q.n,i:q.i,v:q.v,e:0,wt:q.wt};
 $('#gres').textContent='';$('#gst').innerHTML='<div class="chest shake">🎁</div>';
 setTimeout(()=>{$('#gst').innerHTML=`<div class="aura" style="background:radial-gradient(circle,${RC[k]} 0%,${RC[k]}66 45%,transparent 70%)"><div style="font-size:64px">${it.i}</div></div>`;
  $('#gres').innerHTML=`<b style="color:${RC[k]};font-size:18px">[${RN[k]}] ${it.n}</b><br><small>${SL[sl]} +${ib(it)}${sl?'':' · '+(wtOf(it)[0]=='area'?'범위':'단일')}</small>`;
  const cur=it.s?me.g[it.s]:me.w;let eq=!cur||ib(it)>ib(cur);if(eq){if(cur)me.bag.push(cur);if(it.s)me.g[it.s]=it;else me.w=it;$('#gres').innerHTML+='<br><small>장착했어요!</small>'}else{me.bag.push(it);$('#gres').innerHTML+='<br><small>가방에 넣었어요.</small>'}
  busy=false;showG();drawEq();upHud()},1100)};
$('#gx').onclick=()=>{if(!busy)$('#gach').classList.add('hide')};

/* ---- World ---- */
const PG=[0,0,1200,800],RDS=[],SCH=[300,-400,1100,-130],DOOR=[700,-112];
const IN=[0,0,600,400];
let started=false,scene='out',cam={x:0,y:0},en=[],al=[],fx=[],keys={},spawnT=0,outPos=null,tipT='',toastT=0;
function inR(x,y,r,m=0){return x>=r[0]+m&&x<=r[2]-m&&y>=r[1]+m&&y<=r[3]-m}
function walk(x,y){if(stg)return inR(x,y,ARN,18);if(scene=='in')return inR(x,y,IN,18);return inR(x,y,[-500,-500,2500,1400],0)&&!inR(x,y,[SCH[0],-600,SCH[2],SCH[3]],-6)}
const cv=$('#cv'),g=cv.getContext('2d');let W,H;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener('resize',rs);rs();
const P=(x,y,z=0)=>[(x-y)*.7-cam.x+W/2,(x+y)*.35-z-cam.y+H/2];
function poly(pts,col){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fillStyle=col;g.fill()}
function rect(r,col,z=0){poly([P(r[0],r[1],z),P(r[2],r[1],z),P(r[2],r[3],z),P(r[0],r[3],z)],col)}
function start(){started=true;$('#hud').classList.remove('hide');runeMig();me.max=maxHP();me.hp=me.max;attend();drawEq();mkDummies();
 $('#skt').innerHTML=CH[me.id].k?`<div><b style="font-size:20px">Q</b><br>${CH[me.id].k}</div>`:'<div style="color:#999">스킬<br>없음</div>';
 requestAnimationFrame(loop)}
function drawEq(){cdxScan();const n=['무기','머리','몸','신발'];$('#eq').innerHTML=n.map((s,i)=>{const w=i?me.g[i]:me.w;return w?`<div class="sl" style="border-color:${RC[w.r]};box-shadow:0 0 12px ${RC[w.r]}88"><small style="color:#8f98d8">${s}</small><div style="font-size:34px">${w.i}</div><div style="font-size:11px;line-height:1">${stars(w)}</div><span>${w.n}${w.e?' +'+w.e:''}</span></div>`:`<div class="sl" style="color:#789">${s}<br>비어있음</div>`}).join('')}
function upHud(){$('#nm').textContent=NM();$('#lvt').textContent='Lv. '+me.lv;const nx=need(me.lv);$('#xpb i').style.width=(me.xp/nx*100)+'%';$('#xpt').textContent=Math.floor(me.xp)+' / '+nx;$('#hpb i').style.width=Math.max(0,me.hp/me.max*100)+'%';$('#hpt').textContent=Math.max(0,Math.ceil(me.hp))+' / '+me.max;$('#gold').innerHTML='<span class="coin"></span>'+Math.floor(me.gold).toLocaleString()+' 원 · 💎 '+(me.dia||0).toLocaleString();$('#kills').textContent='처치 '+(me.kills||0);$('#luck').textContent='보스 드랍 '+(10*md().d*(1+rb().l)).toFixed(1)+'%'+(rb().l?' (룬 미착용 '+(10*md().d).toFixed(1)+'%)':'');slotHud();$('#stbtn').classList.toggle('pop',me.pts>0);$('#stbtn').textContent=me.pts>0?'+':'📊';$('#wave').textContent=stg?`${stg.s==21?(stg.tw?'무한의 탑 '+stg.tw+'층':stg.rt!==undefined?RT[stg.rt]+' 던전 '+stg.rl:'골드 던전 '+(stg.g+1)):stg.s==20?'튜토리얼':'스테이지 '+(stg.s+1)+' ['+md().n+']'} · WAVE ${Math.min(stg.w,stg.s>=20?5:20)}/${stg.s>=20?5:20} · 남은 적 ${en.filter(e=>!e.dead).length}`:''}
function toast(t){$('#toast').textContent=t;toastT=2}
function say(x,y,t,c='#fff',z=15){fx.push({k:'t',x,y,t,c,z,a:0,L:1})}
function ring(x,y,r,c,L=.7){fx.push({k:'r',x,y,r,c,a:0,L})}

function spawn(){const x=100+Math.random()*1000,y=80+Math.random()*640;if(Math.hypot(x-me.x,y-me.y)<250)return;
 en.push({x,y,hp:30,max:30,cd:0,stun:0,sleep:0,pois:0,hit:0})}
